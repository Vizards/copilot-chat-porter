name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Test release artifact checks
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - run: npm run compile

      - run: mkdir -p dist && npx vsce package -o dist/

      - name: Verify packaged extension identity
        run: python3 .github/scripts/verify-vsix.py "$(node -p "require('./package.json').version")"

      - uses: actions/upload-artifact@v4
        with:
          name: copilot-chat-porter.vsix
          path: dist/*.vsix
          retention-days: 30
